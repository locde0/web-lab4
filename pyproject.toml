[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "migrations",
    "staticfiles",
]

[tool.ruff.lint]
# E, W: PEP-8 errors & warnings (pycodestyle)
# F: Pyflakes
# N: pep8-naming conventions
# I: isort (import sorting)
# DJ: flake8-django rules
select = ["E", "W", "F", "N", "I", "DJ"]
ignore = [
    "E501",  # Line length is handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
# Django settings can have wildcard imports or specific structure
"*/settings.py" = ["F403", "F405", "E501"]
"manage.py" = ["E501"]

[tool.djlint]
profile = "django"
indent = 2
format_css = true
format_js = true
ignore = "H006,H031"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["catalog", "users"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    ".venv/*",
    "venv/*",
    "*/migrations/*",
    "*/tests/*",
    "conftest.py",
    "manage.py",
    "check_submission.py",
    "config/asgi.py",
    "config/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
